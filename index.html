<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LA CONFI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
    }

    .card {
      background: linear-gradient(135deg, #fbe4d4, #f3c9a8);
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 10px 30px rgba(122, 46, 46, 0.2);
    }

    .logo-area {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-area h1 {
      color: #6b2737;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.3;
    }

    .logo-area p {
      color: #8a4a3a;
      font-size: 13px;
      margin-top: 4px;
      font-weight: 600;
    }

    .divider {
      height: 3px;
      background: linear-gradient(90deg, #c9973e, #6b2737);
      border-radius: 2px;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #6b2737;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    label .opcional {
      color: #a3776a;
      font-weight: 400;
      text-transform: none;
      font-size: 12px;
      letter-spacing: 0;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e8c9ae;
      border-radius: 10px;
      font-size: 15px;
      color: #3a2a20;
      background: #fffaf5;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #c9973e;
      box-shadow: 0 0 0 3px rgba(201, 151, 62, 0.2);
      background: white;
    }

    input::placeholder {
      color: #b39a8a;
    }

    .ubicacion-row {
      display: flex;
      gap: 8px;
    }

    .ubicacion-row input {
      flex: 1;
    }

    .btn-ubicacion {
      flex-shrink: 0;
      padding: 0 14px;
      background: #6b2737;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-ubicacion:active {
      transform: scale(0.97);
    }

    .btn-enviar {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #c9973e, #6b2737);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 15px rgba(107, 39, 55, 0.4);
    }

    .btn-enviar:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(107, 39, 55, 0.5);
    }

    .btn-enviar:active {
      transform: translateY(0);
    }

    .footer-note {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #6b2737;
      font-weight: 600;
      line-height: 1.5;
    }

    .mensaje-estado {
      text-align: center;
      margin-top: 14px;
      font-size: 13px;
      font-weight: 600;
      color: #4a7a3a;
      display: none;
    }

    @media (max-width: 480px) {
      .card {
        padding: 30px 22px;
        border-radius: 16px;
      }
      .logo-area h1 { font-size: 19px; }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-area">
      <div><img src="./fonts/logo.png" width="180px" alt="LA CONFI"></div>
      <h1>Formulario de Registro</h1>
      <p>Completa tus datos para continuar</p>
    </div>

    <div class="divider"></div>

    <form id="miFormulario">

      <div class="form-group">
        <label>👤 Nombre</label>
        <input type="text" id="nombre" placeholder="Nombre completo" required>
      </div>

      <div class="form-group">
        <label>🪪 RUC / Cédula</label>
        <input type="text" id="ruc" placeholder="Ej: 1234567890001" pattern="^[0-9]{10}$|^[0-9]{13}$" required>
      </div>

      <div class="form-group">
        <label>📱 Teléfono</label>
        <input type="tel" id="telefono" placeholder="Ej: 0987654321" pattern="^09[0-9]{8}$" maxlength="10" required>
      </div>

      <div class="form-group">
        <label>🏠 Dirección</label>
        <input type="text" id="direccion" placeholder="Calle, número, referencia" required>
      </div>

      <div class="form-group">
        <label>✉️ Mail</label>
        <input type="email" id="mail" placeholder="correo@ejemplo.com" required>
      </div>

      <div class="form-group">
        <label>💳 Forma de Pago</label>
        <select id="formaPago" required>
          <option value="" disabled selected>Selecciona una opción</option>
          <option value="Efectivo">Efectivo</option>
          <option value="Transferencia">Transferencia</option>
          <option value="Tarjeta de Crédito/Débito">Tarjeta de Crédito/Débito</option>
          <option value="Cheque">Cheque</option>
          <option value="Crédito 15 días">Crédito 15 días</option>
          <option value="Crédito 30 días">Crédito 30 días</option>
          <option value="Crédito 45 días">Crédito 45 días</option>
        </select>
      </div>

      <div class="form-group">
        <label>🗂️ Tipo de Registro</label>
        <select id="tipoRegistro" required>
          <option value="" disabled selected>Selecciona una opción</option>
          <option value="Prospección">Prospección</option>
          <option value="Factura">Factura</option>
        </select>
      </div>

      <div class="form-group">
        <label>📍 Ubicación / Coordenadas <span class="opcional">(opcional)</span></label>
        <div class="ubicacion-row">
          <input type="text" id="ubicacion" placeholder="Lat, Long o dirección de referencia">
          <button type="button" class="btn-ubicacion" id="btnUbicacion">Usar mi ubicación</button>
        </div>
      </div>

      <div class="form-group">
        <label>📷 Foto <span class="opcional">(opcional)</span></label>
        <input type="file" id="foto" accept="image/*" capture="environment">
      </div>

      <button type="submit" class="btn-enviar" id="btnEnviar">
        Enviar Registro
      </button>

      <p class="mensaje-estado" id="mensajeEstado">✅ Registro enviado correctamente</p>

    </form>

    <p class="footer-note">🔒 Tu información es confidencial y solo será usada para este registro.</p>
  </div>

  <script>
    // Botón para autocompletar coordenadas con la ubicación del navegador
    document.getElementById('btnUbicacion').addEventListener('click', function() {
      if (!navigator.geolocation) {
        alert('Tu navegador no soporta geolocalización.');
        return;
      }
      navigator.geolocation.getCurrentPosition(function(pos) {
        const lat = pos.coords.latitude.toFixed(6);
        const lng = pos.coords.longitude.toFixed(6);
        document.getElementById('ubicacion').value = `${lat}, ${lng}`;
      }, function(err) {
        alert('No se pudo obtener tu ubicación: ' + err.message);
      });
    });

    document.getElementById('miFormulario').addEventListener('submit', function(e) {
      e.preventDefault();

      const nombre     = document.getElementById('nombre').value.trim();
      const ruc        = document.getElementById('ruc').value.trim();
      const telefono   = document.getElementById('telefono').value.trim();
      const direccion  = document.getElementById('direccion').value.trim();
      const mail       = document.getElementById('mail').value.trim();
      const formaPago  = document.getElementById('formaPago').value;
      const tipoRegistro = document.getElementById('tipoRegistro').value;
      const ubicacion  = document.getElementById('ubicacion').value.trim();
      const fotoInput  = document.getElementById('foto');
      const btnEnviar  = document.getElementById('btnEnviar');

      function enviarDatos(fotoBase64, fotoNombre) {
        fetch("https://script.google.com/macros/s/AKfycbwLiT839af19JtXyudunB7upyyU1Weti5PbJ3Q1xw_klFWN1odQWfPBLRmyPrr8Fx2nlQ/exec", {
          method: "POST",
          mode: "no-cors",
          body: JSON.stringify({
            type: "LA_CONFI",
            nombre: nombre,
            ruc: ruc,
            telefono: telefono,
            direccion: direccion,
            mail: mail,
            formaPago: formaPago,
            tipoRegistro: tipoRegistro,
            ubicacion: ubicacion,
            fotoBase64: fotoBase64 || "",
            fotoNombre: fotoNombre || ""
          })
        });

        document.getElementById('mensajeEstado').style.display = 'block';
        document.getElementById('miFormulario').reset();
        btnEnviar.disabled = false;
        btnEnviar.textContent = "Enviar Registro";
      }

      btnEnviar.disabled = true;

      if (fotoInput.files && fotoInput.files[0]) {
        btnEnviar.textContent = "Procesando foto...";
        const archivo = fotoInput.files[0];
        const lector = new FileReader();

        lector.onload = function() {
          // El resultado viene como "data:image/jpeg;base64,XXXXX" — quitamos el prefijo
          const base64Completo = lector.result;
          const soloBase64 = base64Completo.split(',')[1];
          btnEnviar.textContent = "Enviando...";
          enviarDatos(soloBase64, archivo.name);
        };

        lector.onerror = function() {
          alert('No se pudo procesar la foto. Intenta con otra imagen.');
          btnEnviar.disabled = false;
          btnEnviar.textContent = "Enviar Registro";
        };

        lector.readAsDataURL(archivo);
      } else {
        btnEnviar.textContent = "Enviando...";
        enviarDatos(null, null);
      }
    });
  </script>

</body>
</html>
